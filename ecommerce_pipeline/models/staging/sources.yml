version: 2

sources:
  - name: ingest_ecommerce
    database: ecommerce-analytics-495218
    schema: ingest_ecommerce
    description: "Raw ecommerce data ingested from DummyJSON API via Airbyte"
    tables:
      - name: products
        description: "Raw product data from DummyJSON /products endpoint"
      - name: users
        description: "Raw user data from DummyJSON /users endpoint"
      - name: carts
        description: "Raw cart data from DummyJSON /carts endpoint. Contains nested products array."
      - name: categories
        description: "Raw category data from DummyJSON /products/categories endpoint"

  - name: post_ingest_ecommerce
    database: ecommerce-analytics-495218
    schema: post_ingest_ecommerce
    description: "Enriched data produced by Python ingestion scripts"
    tables:
      - name: stg_product_tag_enriched
        description: "LLM-enriched product tags generated by Ollama gemma2:2b model"